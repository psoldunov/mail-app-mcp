[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-app-mcp"
version = "0.1.0"
description = "A local, draft-only MCP interface to Apple Mail"
requires-python = ">=3.11"
classifiers = ["Operating System :: MacOS :: MacOS X"]
dependencies = ["mcp>=1.20,<2", "pydantic>=2,<3", "pypdf>=5,<7"]

[project.scripts]
mail-app-mcp = "mail_app_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mail_app_mcp = ["mail.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.context/pytest"

[tool.coverage.run]
source = ["mail_app_mcp"]

[tool.coverage.report]
show_missing = true
